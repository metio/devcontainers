name: Terraform
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-image.yml
      - .github/workflows/terraform.yml
      - languages/terraform/**
  schedule:
    - cron:  45 6 * * MON
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  version:
    strategy:
      matrix:
        version: ["latest"]
    name: "${{ matrix.version }}"
    uses: ./.github/workflows/publish-image.yml
    with:
      version: "${{ matrix.version }}"
      language: terraform
      description: Devcontainer for Terraform with Terraform Language Server
    secrets: inherit
